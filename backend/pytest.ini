[tool:pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts =
    --verbose
    --cov=src
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=90
    --tb=short
    --strict-markers
    --disable-warnings

# Minimum coverage requirements
# Constitutional compliance: >90% test coverage required
cov-fail-under = 90

# Markers for different test types
markers =
    unit: Unit tests for individual functions and classes
    integration: Integration tests for component interactions
    contract: Contract tests for API interfaces
    ethical: Ethical compliance tests
    statistical: Statistical validation tests
    slow: Tests that take longer to run
    api: API endpoint tests
    ml: Machine learning model tests

# Test configuration
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Performance requirements for testing
timeout = 300
timeout_method = thread

# Parallel test execution (if pytest-xdist is installed)
# -n auto for automatic CPU core detection

# Reporting
junit_family = xunit2
junit_logging = all

# Minimum test success criteria
# Constitutional compliance: All tests must pass
required_plugins = pytest-cov